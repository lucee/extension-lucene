name: Java CI Combined

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lucee-versions:
        description: 'JSON array of Lucee versions to test'
        default: '["7.0/snapshot/light","7.0/stable/light","6.2/snapshot/light","6.2/stable/light"]'
      dry-run:
        description: 'Dry run - skip deploy to Maven'
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      lucee-matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set Lucee test matrix
        id: set-matrix
        run: |
          DEFAULT='["7.0/snapshot/light","7.0/stable/light","6.2/snapshot/light","6.2/stable/light"]'
          MATRIX="${{ inputs.lucee-versions || '' }}"
          if [ -z "$MATRIX" ]; then
            MATRIX="$DEFAULT"
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Cache Lucee files
        uses: actions/cache@v5
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Install with Maven
        run: |
          echo "------- Maven Install -------";
          mvn -B -e -f pom.xml clean install -Dgoal=install

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lucene-lex
          path: |
            target/*.lex
            !target/*.lite.lex

  test:
    runs-on: ubuntu-latest
    needs: [setup, build]
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(needs.setup.outputs.lucee-matrix) }}
        java: [ 11, 21 ]
    steps:
      - uses: actions/checkout@v5

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: lucene-lex
          path: target

      - name: Checkout Lucee
        uses: actions/checkout@v5
        with:
          repository: lucee/lucee
          path: lucee

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: search
          testAdditional: ${{ github.workspace }}/tests
          LUCEE_LOGGING_FORCE_APPENDER: console
          LUCEE_LOGGING_FORCE_LEVEL: INFO

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, test]
    if: always() && needs.test.result == 'success' && github.ref == 'refs/heads/master' && !inputs.dry-run
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Debug env
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        run: |
          if [[ -z "${MAVEN_USERNAME}" ]]; then echo "MAVEN_USERNAME is empty"; exit 1; fi
          echo "::add-mask::${MAVEN_USERNAME}"   # ensure masking
          echo "MAVEN_USERNAME (masked): ${MAVEN_USERNAME}"
          echo "MAVEN_USERNAME length: ${#MAVEN_USERNAME}"
          printf "MAVEN_USERNAME sha256: %s\n" "$(printf %s "$MAVEN_USERNAME" | sha256sum | cut -d' ' -f1)"

      - name: Install Maven 3.9.16
        # ubuntu-latest moved to Maven 3.10.0 (Oct 2026), which stages maven-metadata-local.xml
        # in org/lucee/lucene-search/; Central then rejects the bundle
        # ("Bundle has content that does NOT have a .pom file"). Pin 3.9.16 for the deploy.
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  /tmp/maven.tar.gz" | sha512sum -c -
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /tmp/apache-maven-3.9.16/bin/mvn -v

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "${{ needs.setup.outputs.version }}" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -Dgoal=deploy --settings maven-settings.xml
          else
            echo "------- Maven Deploy release on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -Dgoal=deploy -DperformRelease=true --settings maven-settings.xml
          fi

      # LDEV-6606: the published .lex files (full and lite) for the github-release job
      - name: Upload artifact for GitHub release
        if: success() && !endsWith(needs.setup.outputs.version, '-SNAPSHOT')
        uses: actions/upload-artifact@v7
        with:
          name: lucene-release
          path: target/*.lex

  # LDEV-6606: publish every final, ALPHA, BETA and RC build as a GitHub release with its .lex files attached,
  # so ext.lucee.org can redirect downloads to GitHub releases (LDEV-6511). -SNAPSHOT builds get no GitHub release.
  # Separate job, so a failure here never blocks the Maven Central deploy.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup, deploy]
    if: >-
      always() && needs.deploy.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !endsWith(needs.setup.outputs.version, '-SNAPSHOT')
    permissions:
      # create the release (and its tag) and upload its assets
      contents: write
    steps:
      # the files the deploy job built and published
      - name: Download published extension
        uses: actions/download-artifact@v7
        with:
          name: lucene-release
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-files -type f \( -name "*-${VERSION}.lex" -o -name "*-${VERSION}.lite.lex" \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .lex files for $VERSION found"; find release-files -type f; exit 1
          fi
          printf 'Asset: %s\n' "${FILES[@]}"

          # the release tag is the exact published version (3.0.0.172 or 3.0.0.172-RC), created on this commit
          # if it does not exist yet. ALPHA/BETA/RC are pre-releases and never "latest".
          if [[ "$VERSION" == *-* ]]; then
            PRE=(--prerelease --latest=false)
          elif [ "$IS_DEFAULT_BRANCH" == "true" ]; then
            PRE=(--latest)
          else
            PRE=(--latest=false)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - uploading assets again"
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            echo "Creating release $VERSION ${PRE[*]} on $GITHUB_SHA"
            gh release create "$VERSION" "${FILES[@]}" "${PRE[@]}" --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Build $VERSION from commit $GITHUB_SHA, published by $RUN_URL"
          fi
